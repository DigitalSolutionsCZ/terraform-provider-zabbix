name: PR E2E Tests

on:
  pull_request:

jobs:
  e2e-pr:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Build local provider
        run: make build

      - name: 🧩 Install local provider plugin
        run: make install-plugin

      - name: 🩹 Patch main.tf files to use local provider
        run: |
          find e2e-tests -name "main.tf" -exec sed -i 's|source *= *"DigitalSolutionsCZ/zabbix"|source = "localdomain/local/zabbix"|' {} +

      - name: 🐳 Start Zabbix and zabbix agent via Docker Compose
        run: make up

      - name: Wait for Zabbix
        run: |
          docker ps
          docker ps -a
          for i in {1..30}; do
            if curl -sSf http://localhost:8080/api_jsonrpc.php >/dev/null; then
              echo "Zabbix API is up!"
              exit 0
            fi
            echo "Waiting for Zabbix API..."
            sleep 5
          done
          echo "Zabbix API did not start in time"
          exit 1

      - name: ⬇️ Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: 🔍 Validate formatting (terraform fmt)
        run: terraform fmt -check -recursive

      - name: 🧪 Run Terraform E2E tests
        run: |
          FULL_CYCLE_DIRS=("host")

          for dir in "${FULL_CYCLE_DIRS[@]}"; do
            if [ -d "e2e-tests/$dir" ]; then
              echo "▶️ Running full Terraform cycle in e2e-tests/$dir"
              cd "e2e-tests/$dir"
              terraform init -input=false
              terraform fmt -check
              terraform validate
              terraform apply -auto-approve
              terraform destroy -auto-approve
              cd -
            fi
          done
